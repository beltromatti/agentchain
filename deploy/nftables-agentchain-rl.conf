#!/usr/sbin/nft -f
# AgentChain edge rate limiting — kernel-level via nftables.
#
# Layered with Caddy (which enforces method allowlist, 64KB body cap,
# request/idle timeouts). This rule shapes the rate of NEW TCP connections
# on the public HTTP/HTTPS ports.
#
# Limits (per source IP):
#   - HTTP/HTTPS: 300 new connections / minute, burst 50
#   - Loopback: bypassed
#
# Rationale: a generous-but-bounded envelope. A polling agent or a wallet
# doing read traffic comfortably stays under it; a scanner spraying probe
# URLs blows past it within a few hundred milliseconds.

table inet agentchain_rl
delete table inet agentchain_rl

table inet agentchain_rl {
    set rl_ipv4 {
        type ipv4_addr
        flags dynamic
        timeout 1m
    }
    set rl_ipv6 {
        type ipv6_addr
        flags dynamic
        timeout 1m
    }

    chain input {
        type filter hook input priority -10; policy accept;

        tcp dport { 80, 443 } ct state new \
            ip saddr != 127.0.0.1 \
            add @rl_ipv4 { ip saddr limit rate over 300/minute burst 50 packets } \
            counter drop

        tcp dport { 80, 443 } ct state new \
            ip6 saddr != ::1 \
            add @rl_ipv6 { ip6 saddr limit rate over 300/minute burst 50 packets } \
            counter drop
    }
}
