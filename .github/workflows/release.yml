name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            artifact_suffix: linux-x86_64
            kind: posix
            mac_arch: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
            kind: posix
            mac_arch: ""
          - target: macos-arm64
            runner: macos-14
            artifact_suffix: macos-arm64
            kind: posix
            mac_arch: arm64
          - target: macos-x86_64
            runner: macos-14
            artifact_suffix: macos-x86_64
            kind: posix
            mac_arch: x86_64
          - target: windows-x86_64
            runner: windows-2022
            artifact_suffix: windows-x86_64
            kind: msys2
            mac_arch: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake autoconf automake libtool pkg-config

      - name: Set up MSYS2 (Windows)
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libsodium
            base-devel
            autoconf
            automake
            libtool

      # -----------------------------------------------------------------
      # POSIX path (Linux + macOS): build a fully static libsodium and
      # link AgentChain against it, so the released binary only depends
      # on the platform's libc + libpthread.
      # -----------------------------------------------------------------
      - name: Build static libsodium (POSIX)
        if: matrix.kind == 'posix'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          cd third_party
          curl -fsSL https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz -o libsodium.tar.gz
          tar xzf libsodium.tar.gz
          cd libsodium-1.0.20
          OPTS="--prefix=$PWD/_install --disable-shared --enable-static --with-pic"
          if [ "${{ matrix.mac_arch }}" = "x86_64" ]; then
            export CC="clang -arch x86_64"
            export CFLAGS="-arch x86_64"
            export LDFLAGS="-arch x86_64"
            OPTS="$OPTS --host=x86_64-apple-darwin"
          elif [ "${{ matrix.mac_arch }}" = "arm64" ]; then
            export CC="clang -arch arm64"
            export CFLAGS="-arch arm64"
            export LDFLAGS="-arch arm64"
          fi
          ./configure $OPTS
          make -j
          make install
          echo "SODIUM_STATIC=$PWD/_install" >> "$GITHUB_ENV"

      - name: Configure AgentChain (POSIX)
        if: matrix.kind == 'posix'
        shell: bash
        run: |
          set -euo pipefail
          OPTS="-DCMAKE_BUILD_TYPE=Release \
                -DSODIUM_INCLUDE_DIRS=$SODIUM_STATIC/include \
                -DSODIUM_LIBRARIES=$SODIUM_STATIC/lib/libsodium.a \
                -DAGENTCHAIN_BUILD_TESTS=OFF"
          if [ "${{ matrix.mac_arch }}" = "x86_64" ]; then
            OPTS="$OPTS -DCMAKE_OSX_ARCHITECTURES=x86_64"
          elif [ "${{ matrix.mac_arch }}" = "arm64" ]; then
            OPTS="$OPTS -DCMAKE_OSX_ARCHITECTURES=arm64"
          fi
          cmake -S . -B build $OPTS

      - name: Build (POSIX)
        if: matrix.kind == 'posix'
        run: cmake --build build -j

      # -----------------------------------------------------------------
      # Windows path: MSYS2 / MinGW64. libsodium comes from the MSYS2
      # repository as a static library; we link statically against
      # libstdc++, libgcc and winpthread so the resulting .exe runs on a
      # bare Windows install without bundled DLLs.
      # -----------------------------------------------------------------
      - name: Configure + build (Windows / MSYS2)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-static" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -Wl,-Bstatic -lwinpthread" \
            -DAGENTCHAIN_BUILD_TESTS=OFF
          cmake --build build -j

      - name: Smoke test (POSIX, native or Rosetta)
        if: matrix.kind == 'posix'
        shell: bash
        run: |
          set -euo pipefail
          file build/agentchain
          if [ "${{ matrix.mac_arch }}" = "x86_64" ] && [ "$(uname -m)" = "arm64" ]; then
            arch -x86_64 ./build/agentchain version
          else
            ./build/agentchain version
          fi

      - name: Smoke test (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          ls -la build/
          ./build/agentchain.exe version

      - name: Strip binary (POSIX)
        if: matrix.kind == 'posix'
        shell: bash
        run: strip build/agentchain

      - name: Strip binary (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: strip build/agentchain.exe

      - name: Determine version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Stage artefact (POSIX)
        if: matrix.kind == 'posix'
        shell: bash
        run: |
          set -euo pipefail
          DEST="agentchain-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}"
          mkdir -p "dist/$DEST"
          cp build/agentchain               "dist/$DEST/"
          cp PROTOCOL.md README.md          "dist/$DEST/"
          cp TECHNICAL-IMPLEMENTATION.md    "dist/$DEST/"
          cp LICENSE                        "dist/$DEST/"
          cp -r deploy                      "dist/$DEST/"
          cd dist
          tar czf "${DEST}.tar.gz" "$DEST"
          shasum -a 256 "${DEST}.tar.gz" > "${DEST}.tar.gz.sha256"

      - name: Stage artefact (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          DEST="agentchain-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}"
          mkdir -p "dist/$DEST"
          cp build/agentchain.exe            "dist/$DEST/"
          cp PROTOCOL.md README.md           "dist/$DEST/"
          cp TECHNICAL-IMPLEMENTATION.md     "dist/$DEST/"
          cp LICENSE                         "dist/$DEST/"
          cp -r deploy                       "dist/$DEST/"
          cd dist
          # Windows 10+ ships native tar; tar.gz is universally extractable.
          tar czf "${DEST}.tar.gz" "$DEST"
          sha256sum "${DEST}.tar.gz" > "${DEST}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: AgentChain ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/agentchain-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz
            dist/agentchain-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}.tar.gz.sha256
